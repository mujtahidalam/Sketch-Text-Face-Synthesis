[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmface"
version = "1.0.0"
description = "Sketch and text conditioned facial image synthesis with a modified U-Net GAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "diffusers>=0.35,<0.38",
  "transformers>=4.48",
  "accelerate>=1.10",
  "lpips>=0.1.4",
  "torchmetrics>=1.7",
  "torch-fidelity>=0.3",
  "datasets>=4",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.14",
  "pillow>=11",
  "pyyaml>=6",
  "tqdm>=4.67",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
